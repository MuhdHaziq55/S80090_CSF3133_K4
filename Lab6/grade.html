<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Grade Calculator</title>
    <!-- Part 2 (item 9): link the new stylesheet -->
    <link rel="stylesheet" href="grade.css">
</head>
<body>
    <h2>Student Grade Calculator</h2>

    <!-- Fixed: "return" added so a false result stops the form from submitting -->
    <form name="gradeForm" onsubmit="return checkMark()">
        <label for="name">Name: </label>
        <input type="text" id="name" name="name"><br>
        <label for="mark">Mark (0 - 100): </label>
        <input type="text" id="mark" name="mark"><br>
        <button type="submit">Check Grade</button>
        <!-- Part 2 (item 7): type="button" so it fills a random mark without submitting the form -->
        <button type="button" onclick="randomMark()">Random Mark</button>
    </form>

    <!-- Result message (colour is set in grade.js) -->
    <p id="result"></p>
    <!-- Part 2 (item 8): date and time of the check -->
    <p id="checkedTime"></p>

    <!-- Fixed: function name is showTable (matches grade.js) -->
    <button onclick="showTable()">Show Grade Table</button>
    <div id="tableContainer"></div>

    <script src="grade.js"></script>
</body>
</html>
